
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ form_title }} | E-Commerce BI</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f4f6fb; color: #202840; }
        header { background: #172554; color: white; padding: 20px 30px; }
        main { max-width: 650px; margin: 30px auto; padding: 20px; }
        .panel { background: white; padding: 25px; border-radius: 12px; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input { width: 100%; padding: 12px; margin-top: 6px; box-sizing: border-box; border: 1px solid #cbd5e1; border-radius: 6px; }
        button { margin-top: 20px; background: #2563eb; color: white; padding: 12px 18px; border: 0; border-radius: 6px; cursor: pointer; }
        a { color: #2563eb; text-decoration: none; }
        .notice { padding: 12px; background: #eff6ff; margin-bottom: 10px; border-radius: 5px; }
    </style>
</head>
<body>
    <header>
        <h2>E-Commerce BI Dashboard</h2>
        <a href="{{ url_for('customers') }}" style="color:white">← Back to Customers</a>
    </header>

    <main>
        <div class="panel">
            <h1>{{ form_title }}</h1>

            {% for category, message in get_flashed_messages(with_categories=true) %}
                <div class="notice">{{ message }}</div>
            {% endfor %}

            <form method="POST">
                <label for="full_name">Full Name *</label>
                <input id="full_name" name="full_name" required value="{{ customer.full_name if customer else '' }}">

                <label for="email">Email *</label>
                <input id="email" name="email" type="email" required value="{{ customer.email if customer else '' }}">

                <label for="phone">Phone</label>
                <input id="phone" name="phone" value="{{ customer.phone if customer else '' }}">

                <label for="city">City</label>
                <input id="city" name="city" value="{{ customer.city if customer else '' }}">

                <button type="submit">Save Customer</button>
                <a href="{{ url_for('customers') }}">Cancel</a>
            </form>
        </div>
    </main>
</body>
</html>
