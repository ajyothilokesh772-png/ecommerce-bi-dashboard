
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>All Products | Commerce BI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            padding: 25px;
        }
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }
        .product-card {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px #ccc;
        }
        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <h1>All Products</h1>

    {% if products %}
    <div class="products">
        {% for product in products %}
        <div class="product-card">
            {% if product.image %}
            <img
                src="{{ url_for('static', filename='images/' ~ product.image) }}"
                alt="{{ product.product_name }}"
            >
            {% else %}
            <p>No image available</p>
            {% endif %}

            <h3>{{ product.product_name }}</h3>
            <p>Category: {{ product.category }}</p>
            <p>Product ID: {{ product.product_id }}</p>
        </div>
        {% endfor %}
    </div>
    {% else %}
        <p>No products found.</p>
    {% endif %}
</body>
</html>
